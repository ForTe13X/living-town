name: Trusted cafe visual attestation

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full same-repository candidate commit SHA to capture
        required: true
        type: string

permissions:
  contents: read
  attestations: write
  id-token: write

concurrency:
  group: trusted-cafe-${{ inputs.candidate_sha }}
  cancel-in-progress: false

jobs:
  trusted_capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Require protected default-branch workflow identity
        shell: bash
        env:
          EXPECTED_WORKFLOW_REF: ForTe13X/living-town/.github/workflows/trusted-cafe-attestation.yml@refs/heads/master
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == "ForTe13X/living-town" ]]
          [[ "$GITHUB_REF" == "refs/heads/master" ]]
          [[ "$GITHUB_WORKFLOW_REF" == "$EXPECTED_WORKFLOW_REF" ]]
          [[ "${{ inputs.candidate_sha }}" =~ ^[0-9a-f]{40}$ ]]
          printf 'TRUST_ROOT repository=%s workflow_ref=%s workflow_sha=%s candidate=%s\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_WORKFLOW_REF" "$GITHUB_SHA" \
            "${{ inputs.candidate_sha }}"

      - name: Checkout trusted control tree
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false

      - name: Checkout exact candidate tree as untrusted input
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.candidate_sha }}
          path: candidate
          persist-credentials: false

      - name: Verify both checkout identities
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git -C trusted rev-parse HEAD)" == "$GITHUB_SHA" ]]
          [[ "$(git -C candidate rev-parse HEAD)" == "${{ inputs.candidate_sha }}" ]]
          [[ -z "$(git -C trusted status --porcelain)" ]]
          [[ -z "$(git -C candidate status --porcelain)" ]]

      - name: Set up pinned Python runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11.16"

      - name: Install and verify trusted renderer runtime
        shell: bash
        run: |
          set -euo pipefail
          GV=4.6.2-stable
          curl -fLo godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GV}/Godot_v${GV}_linux.x86_64.zip"
          printf '%s  %s\n' \
            '30e6b6d141f0cd5bebd629ad1d0ef1324e60091bb20662d026b402ba58c59937' \
            godot.zip | sha256sum -c -
          unzip -q godot.zip
          sudo mv "Godot_v${GV}_linux.x86_64" /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          [[ "$(sha256sum /usr/local/bin/godot | awk '{print $1}')" == \
              '5a806b2b385279d9607094d33e946ed828e9606df4cb46d258ca27468dc5c1c9' ]]
          python -m pip install --disable-pip-version-check 'pillow==11.3.0'
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1=1.7.0-1build1 \
            libglx-mesa0=25.2.8-0ubuntu0.24.04.2 \
            libgl1-mesa-dri=25.2.8-0ubuntu0.24.04.2 \
            mesa-utils=9.0.0-2 \
            xauth=1:1.1.2-1build1 \
            xvfb=2:21.1.12-1ubuntu1.6
          godot --version
          python --version
          dpkg-query -W -f='${Package}=${Version}\n' \
            libgl1 libglx-mesa0 libgl1-mesa-dri mesa-utils xauth xvfb

      - name: Import exact candidate project
        shell: bash
        run: godot --headless --path candidate/game --import || true

      - name: Capture and verify with trusted control tree
        shell: bash
        env:
          GODOT: godot
          PYTHON: python
        run: |
          set -euo pipefail
          bash trusted/tools/trusted_cafe_capture.sh \
            candidate "$RUNNER_TEMP/trusted-cafe-evidence" \
            "${{ inputs.candidate_sha }}" "$GITHUB_SHA" "$GITHUB_REPOSITORY"
          git -C trusted diff --exit-code
          git -C candidate diff --exit-code

      - name: Attest canonical evidence bundle
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/trusted-cafe-evidence/trusted-cafe-evidence.tar.gz

      - name: Upload attested trusted capture
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trusted-cafe-${{ inputs.candidate_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/trusted-cafe-evidence/trusted-cafe-evidence.tar.gz
            ${{ runner.temp }}/trusted-cafe-evidence/trusted-cafe-manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish verification receipt
        shell: bash
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/trusted-cafe-evidence/trusted-cafe-evidence.tar.gz"
          manifest="$RUNNER_TEMP/trusted-cafe-evidence/trusted-cafe-manifest.json"
          {
            echo '### Trusted cafe evidence attestation'
            echo
            echo "- candidate SHA: ${{ inputs.candidate_sha }}"
            echo "- trusted workflow SHA: $GITHUB_SHA"
            echo "- bundle SHA-256: $(sha256sum "$bundle" | awk '{print $1}')"
            echo "- manifest SHA-256: $(sha256sum "$manifest" | awk '{print $1}')"
            echo "- attestation URL: ${{ steps.attest.outputs.attestation-url }}"
            echo '- verify: `gh attestation verify trusted-cafe-evidence.tar.gz --repo ForTe13X/living-town --signer-workflow ForTe13X/living-town/.github/workflows/trusted-cafe-attestation.yml`'
          } >>"$GITHUB_STEP_SUMMARY"
