name: Trusted cafe source attestation

on:
  pull_request:
    branches: [master]
    paths:
      - .github/workflows/trusted-cafe-attestation.yml
      - tools/trusted_cafe_capture.sh
      - tools/cafe_authored_manifest.py
      - tools/verify_cafe_attested_evidence.py
      - tools/cafe_attestation_selftest.py
      - evidence/cafe/runtime-lock.v1.json
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full same-repository candidate commit SHA to capture
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: trusted-cafe-${{ github.event_name }}-${{ inputs.candidate_sha || github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  pull_request_runtime_qualification:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: trusted
          persist-credentials: false

      - name: Enforce the six-path Stack A lease
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "$(git -C trusted rev-parse HEAD)" == "$HEAD_SHA" ]]
          [[ -z "$(git -C trusted status --porcelain=v1 --untracked-files=all)" ]]
          mapfile -t changed < <(git -C trusted diff --name-only "$BASE_SHA" "$HEAD_SHA")
          ((${#changed[@]} > 0))
          for path in "${changed[@]}"; do
            case "$path" in
              .github/workflows/trusted-cafe-attestation.yml|\
              tools/trusted_cafe_capture.sh|\
              tools/cafe_authored_manifest.py|\
              tools/verify_cafe_attested_evidence.py|\
              tools/cafe_attestation_selftest.py|\
              evidence/cafe/runtime-lock.v1.json) ;;
              *) echo "out-of-lease path: $path" >&2; exit 1 ;;
            esac
          done
          [[ "${#changed[@]}" -eq 6 ]]

      - name: Build the immutable runtime twice
        shell: bash
        run: |
          set -euo pipefail
          bash trusted/tools/trusted_cafe_capture.sh build-runtime \
            trusted "$RUNNER_TEMP/cafe-runtime"

      - name: Load and qualify the exact digest runtime
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/cafe-runtime/runtime.oci.tar"
          receipt="$RUNNER_TEMP/cafe-runtime/runtime-build-receipt.json"
          manifest_digest="$(sed -n 's/.*"oci_manifest_digest":"\([0-9a-f]\{64\}\)".*/\1/p' "$receipt")"
          validation_digest="$(sed -n 's/.*"validation_oci_manifest_digest":"\([0-9a-f]\{64\}\)".*/\1/p' "$receipt")"
          [[ "$manifest_digest" =~ ^[0-9a-f]{64}$ ]]
          [[ "$validation_digest" =~ ^[0-9a-f]{64}$ ]]
          podman image rm -f localhost/living-town/trusted-cafe-runtime:v1 >/dev/null 2>&1 || true
          podman load --input "$archive"
          runtime_ref="localhost/living-town/trusted-cafe-runtime@sha256:$manifest_digest"
          validation_ref="localhost/living-town/trusted-cafe-validation@sha256:$validation_digest"
          podman image exists "$runtime_ref"
          podman image exists "$validation_ref"
          if podman run --pull=never --rm \
            "localhost/living-town/trusted-cafe-runtime@sha256:$(printf '0%.0s' {1..64})" true; then
            echo 'wrong runtime digest executed' >&2
            exit 1
          fi
          if podman run --pull=never --rm --network none --read-only --cap-drop all \
            --security-opt no-new-privileges --volume "$PWD/trusted:/trusted:ro" \
            "$runtime_ref" touch /trusted/.write-must-fail; then
            echo 'read-only trusted mount accepted a write' >&2
            exit 1
          fi
          {
            printf 'runtime_ref=%s\n' "$runtime_ref"
            printf 'podman=%s\n' "$(podman --version)"
            printf 'docker_context=%s\n' "$(docker context show)"
            printf 'platform=linux/amd64 network=none read_only=true cap_drop=ALL no_new_privileges=true\n'
            printf 'trusted_mount=read-only scratch=runner-temp-task-owned cache=none cleanup=--rm\n'
            printf 'material_commands=selftest-twice,receipt-compare,runtime-smoke,archive-budget\n'
            docker version --format 'docker_client={{.Client.Version}} docker_server={{.Server.Version}} docker_os={{.Server.Os}} docker_arch={{.Server.Arch}}'
            podman run --pull=never --rm --network none --read-only --cap-drop all \
              --security-opt no-new-privileges --pids-limit 128 --memory 768m --cpus 2 \
              --tmpfs /tmp:rw,nosuid,nodev,size=268435456 "$runtime_ref" \
              python -B -c 'import PIL,platform; print(platform.python_version(), PIL.__version__)'
            podman run --pull=never --rm --network none --read-only --cap-drop all \
              --security-opt no-new-privileges --pids-limit 128 --memory 768m --cpus 2 \
              --tmpfs /tmp:rw,nosuid,nodev,size=268435456 "$runtime_ref" \
              godot --version
          } | tee "$RUNNER_TEMP/runtime-container-receipt.txt"
          echo "ref=$runtime_ref" >> "$GITHUB_OUTPUT"
          echo "validation_ref=$validation_ref" >> "$GITHUB_OUTPUT"

      - name: Run two fresh isolated trust-root self-tests
        shell: bash
        env:
          VALIDATION_REF: ${{ steps.runtime.outputs.validation_ref }}
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/cafe-selftest-a" "$RUNNER_TEMP/cafe-selftest-b"
          for lane in a b; do
            podman run --pull=never --rm --name "cafe-selftest-${lane}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
              --network none --read-only --cap-drop all --security-opt no-new-privileges \
              --pids-limit 256 --memory 1g --cpus 2 \
              --tmpfs /tmp:rw,nosuid,nodev,size=536870912 \
              --volume "$PWD/trusted:/trusted:ro" \
              --volume "$RUNNER_TEMP/cafe-selftest-${lane}:/scratch:rw" \
              --workdir /trusted "$VALIDATION_REF" \
              python -B tools/cafe_attestation_selftest.py \
                --work-dir /scratch/work --receipt /scratch/receipt.json
          done
          podman run --pull=never --rm --network none --read-only --cap-drop all \
            --security-opt no-new-privileges --pids-limit 64 --memory 256m --cpus 1 \
            --volume "$RUNNER_TEMP/cafe-selftest-a:/a:ro" \
            --volume "$RUNNER_TEMP/cafe-selftest-b:/b:ro" "$VALIDATION_REF" \
            cmp /a/receipt.json /b/receipt.json

      - name: Enforce hosted artifact budget in the exact runtime
        shell: bash
        env:
          RUNTIME_REF: ${{ steps.runtime.outputs.ref }}
        run: |
          set -euo pipefail
          podman run --pull=never --rm --network none --read-only --cap-drop all \
            --security-opt no-new-privileges --pids-limit 64 --memory 256m --cpus 1 \
            --tmpfs /tmp:rw,nosuid,nodev,size=67108864 \
            --volume "$PWD/trusted:/trusted:ro" \
            --volume "$RUNNER_TEMP/cafe-runtime:/runtime:ro" "$RUNTIME_REF" \
            python -B - /trusted/evidence/cafe/runtime-lock.v1.json /runtime/runtime.oci.tar <<'PY'
          import hashlib, json, os, sys
          lock = json.load(open(sys.argv[1], encoding="utf-8"))
          archive = sys.argv[2]
          size = os.path.getsize(archive)
          assert size <= lock["limits"]["max_runtime_archive_bytes"], (size, lock["limits"])
          assert lock["limits"]["hosted_timeout_minutes"] <= 35
          assert lock["limits"]["artifact_retention_days"] >= 90
          print(hashlib.sha256(open(archive, "rb").read()).hexdigest(), size)
          PY

      - name: Upload reproducible runtime qualification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cafe-runtime-qualification-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/cafe-runtime/runtime.oci.tar
            ${{ runner.temp }}/cafe-runtime/runtime-build-receipt.json
            ${{ runner.temp }}/cafe-selftest-a/receipt.json
            ${{ runner.temp }}/cafe-selftest-b/receipt.json
            ${{ runner.temp }}/runtime-container-receipt.txt
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  protected_capture_and_attestation:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: Require protected default-branch workflow identity
        shell: bash
        env:
          EXPECTED_WORKFLOW_REF: ForTe13X/living-town/.github/workflows/trusted-cafe-attestation.yml@refs/heads/master
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == "ForTe13X/living-town" ]]
          [[ "$GITHUB_REF" == "refs/heads/master" ]]
          [[ "$GITHUB_WORKFLOW_REF" == "$EXPECTED_WORKFLOW_REF" ]]
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]

      - name: Checkout protected trust root
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          path: trusted
          persist-credentials: false

      - name: Checkout exact same-repository candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
          path: candidate
          persist-credentials: false

      - name: Verify checkout identities
        id: identity
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          [[ "$(git -C trusted rev-parse HEAD)" == "$GITHUB_SHA" ]]
          [[ "$(git -C candidate rev-parse HEAD)" == "$CANDIDATE_SHA" ]]
          [[ -z "$(git -C trusted status --porcelain=v1 --untracked-files=all)" ]]
          [[ -z "$(git -C candidate status --porcelain=v1 --untracked-files=all)" ]]
          echo "candidate_tree=$(git -C candidate show -s --format='%T' HEAD)" >> "$GITHUB_OUTPUT"
          echo "workflow_tree=$(git -C trusted show -s --format='%T' HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build the immutable runtime twice
        shell: bash
        run: |
          set -euo pipefail
          bash trusted/tools/trusted_cafe_capture.sh build-runtime \
            trusted "$RUNNER_TEMP/cafe-runtime"

      - name: Attest exact runtime OCI archive
        id: attest_runtime
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: ${{ runner.temp }}/cafe-runtime/runtime.oci.tar

      - name: Load the exact digest runtime and prepare hash-pinned gate tools
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/cafe-runtime/runtime-build-receipt.json"
          manifest_digest="$(sed -n 's/.*"oci_manifest_digest":"\([0-9a-f]\{64\}\)".*/\1/p' "$receipt")"
          validation_digest="$(sed -n 's/.*"validation_oci_manifest_digest":"\([0-9a-f]\{64\}\)".*/\1/p' "$receipt")"
          [[ "$manifest_digest" =~ ^[0-9a-f]{64}$ ]]
          [[ "$validation_digest" =~ ^[0-9a-f]{64}$ ]]
          podman image rm -f localhost/living-town/trusted-cafe-runtime:v1 >/dev/null 2>&1 || true
          podman load --input "$RUNNER_TEMP/cafe-runtime/runtime.oci.tar"
          runtime_ref="localhost/living-town/trusted-cafe-runtime@sha256:$manifest_digest"
          validation_ref="localhost/living-town/trusted-cafe-validation@sha256:$validation_digest"
          podman image exists "$runtime_ref"
          podman image exists "$validation_ref"
          if podman run --pull=never --rm \
            "localhost/living-town/trusted-cafe-runtime@sha256:$(printf '0%.0s' {1..64})" true; then
            echo 'wrong runtime digest executed' >&2
            exit 1
          fi
          {
            printf 'runtime_ref=%s\n' "$runtime_ref"
            printf 'podman=%s\n' "$(podman --version)"
            printf 'docker_context=%s\n' "$(docker context show)"
            docker version --format 'docker_client={{.Client.Version}} docker_server={{.Server.Version}} docker_os={{.Server.Os}} docker_arch={{.Server.Arch}}'
            printf 'platform=linux/amd64 default_network=none attestation_network=token-scoped\n'
            printf 'read_only=true cap_drop=ALL no_new_privileges=true candidate_mount=read-only trusted_mount=read-only\n'
            printf 'scratch=runner-temp-task-owned cache=none cleanup=--rm\n'
            printf 'material_commands=selftest-twice,authored-compile,runtime-attestation,capture,evidence-verification,budgets\n'
          } > "$RUNNER_TEMP/cafe-runtime/runtime-container-receipt.txt"
          mkdir "$RUNNER_TEMP/cafe-gate-tools"
          curl --fail --location --silent --show-error --retry 5 --retry-all-errors \
            --output "$RUNNER_TEMP/cafe-gate-tools/gh_2.98.0_linux_amd64.tar.gz" \
            https://github.com/cli/cli/releases/download/v2.98.0/gh_2.98.0_linux_amd64.tar.gz
          podman run --pull=never --rm --network none --read-only --cap-drop all \
            --security-opt no-new-privileges --pids-limit 64 --memory 256m --cpus 1 \
            --tmpfs /tmp:rw,nosuid,nodev,size=67108864 \
            --volume "$RUNNER_TEMP/cafe-gate-tools:/gate-tools:rw" "$runtime_ref" bash -euo pipefail -c '
              printf "%s  %s\n" 3b8ac6b30336802fc1a858d7c084e11cdf24ac1a761ca90b68022d7d729208de \
                /gate-tools/gh_2.98.0_linux_amd64.tar.gz | sha256sum -c -
              tar -xzf /gate-tools/gh_2.98.0_linux_amd64.tar.gz -C /gate-tools
              test "$(/gate-tools/gh_2.98.0_linux_amd64/bin/gh --version | awk "NR==1 {print \$3}")" = 2.98.0
            '
          echo "ref=$runtime_ref" >> "$GITHUB_OUTPUT"
          echo "validation_ref=$validation_ref" >> "$GITHUB_OUTPUT"

      - name: Run two fresh isolated trust-root self-tests
        shell: bash
        env:
          VALIDATION_REF: ${{ steps.runtime.outputs.validation_ref }}
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/cafe-selftest-a" "$RUNNER_TEMP/cafe-selftest-b"
          for lane in a b; do
            podman run --pull=never --rm --name "cafe-selftest-${lane}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
              --network none --read-only --cap-drop all --security-opt no-new-privileges \
              --pids-limit 256 --memory 1g --cpus 2 \
              --tmpfs /tmp:rw,nosuid,nodev,size=536870912 \
              --volume "$PWD/trusted:/trusted:ro" \
              --volume "$RUNNER_TEMP/cafe-selftest-${lane}:/scratch:rw" \
              --workdir /trusted "$VALIDATION_REF" python -B tools/cafe_attestation_selftest.py \
                --work-dir /scratch/work --receipt /scratch/receipt.json
          done
          podman run --pull=never --rm --network none --read-only --cap-drop all \
            --security-opt no-new-privileges --volume "$RUNNER_TEMP/cafe-selftest-a:/a:ro" \
            --volume "$RUNNER_TEMP/cafe-selftest-b:/b:ro" "$VALIDATION_REF" \
            cmp /a/receipt.json /b/receipt.json

      - name: Compile candidate source inside the exact runtime
        shell: bash
        env:
          VALIDATION_REF: ${{ steps.runtime.outputs.validation_ref }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          CANDIDATE_TREE: ${{ steps.identity.outputs.candidate_tree }}
          WORKFLOW_TREE: ${{ steps.identity.outputs.workflow_tree }}
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/cafe-preflight"
          podman run --pull=never --rm --network none --read-only --cap-drop all \
            --security-opt no-new-privileges --pids-limit 128 --memory 768m --cpus 2 \
            --tmpfs /tmp:rw,nosuid,nodev,size=268435456 \
            --volume "$PWD/trusted:/trusted:ro" --volume "$PWD/candidate:/candidate:ro" \
            --volume "$RUNNER_TEMP/cafe-preflight:/preflight:rw" \
            --env CANDIDATE_SHA --env CANDIDATE_TREE --env GITHUB_REPOSITORY --env GITHUB_SHA \
            --env WORKFLOW_TREE "$VALIDATION_REF" bash -euo pipefail -c '
              cmp -s /candidate/evidence/cafe/cafe-authored-ids.v1.json /trusted/evidence/cafe/cafe-authored-ids.v1.json
              cmp -s /candidate/evidence/cafe/cafe-authored-manifest.v1.json /trusted/evidence/cafe/cafe-authored-manifest.v1.json
              python -B /trusted/tools/cafe_authored_manifest.py --repo /candidate \
                --ids /trusted/evidence/cafe/cafe-authored-ids.v1.json \
                --check /trusted/evidence/cafe/cafe-authored-manifest.v1.json \
                --output /preflight/cafe-authored-manifest.v1.json
              cmp -s /preflight/cafe-authored-manifest.v1.json /trusted/evidence/cafe/cafe-authored-manifest.v1.json
              authored_sha="$(sha256sum /preflight/cafe-authored-manifest.v1.json | awk "{print \$1}")"
              printf "{\"authored_manifest_sha256\":\"%s\",\"candidate\":{\"clean\":true,\"sha\":\"%s\",\"tree\":\"%s\"},\"repository\":\"%s\",\"schema\":\"living-town.cafe-preverified-checkouts.v1\",\"source\":\"host-read-only-git\",\"workflow\":{\"clean\":true,\"sha\":\"%s\",\"tree\":\"%s\"}}\n" \
                "$authored_sha" "$CANDIDATE_SHA" "$CANDIDATE_TREE" "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$WORKFLOW_TREE" \
                > /preflight/preverified-checkouts.v1.json
              ! touch /trusted/.write-must-fail
              ! touch /candidate/.write-must-fail
            '

      - name: Verify runtime attestation before loading
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME_REF: ${{ steps.runtime.outputs.ref }}
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/cafe-runtime-verification"
          podman run --pull=never --rm --read-only --cap-drop all \
            --security-opt no-new-privileges --pids-limit 128 --memory 512m --cpus 1 \
            --tmpfs /tmp:rw,nosuid,nodev,size=134217728 --env GH_TOKEN \
            --env GITHUB_REPOSITORY --env GITHUB_SHA \
            --volume "$RUNNER_TEMP/cafe-runtime:/runtime:ro" \
            --volume "$RUNNER_TEMP/cafe-gate-tools:/gate-tools:ro" \
            --volume "$RUNNER_TEMP/cafe-runtime-verification:/verification:rw" \
            "$RUNTIME_REF" bash -euo pipefail -c '
              /gate-tools/gh_2.98.0_linux_amd64/bin/gh attestation verify /runtime/runtime.oci.tar \
                --repo "$GITHUB_REPOSITORY" \
                --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/trusted-cafe-attestation.yml" \
                --signer-digest "$GITHUB_SHA" --source-digest "$GITHUB_SHA" \
                --source-ref refs/heads/master --cert-oidc-issuer https://token.actions.githubusercontent.com \
                --deny-self-hosted-runners --predicate-type https://slsa.dev/provenance/v1 \
                --format json > /verification/runtime-attestation-verification.json
            '

      - name: Load attested archive and capture exact candidate
        id: capture
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          CANDIDATE_TREE: ${{ steps.identity.outputs.candidate_tree }}
          WORKFLOW_TREE: ${{ steps.identity.outputs.workflow_tree }}
          RUNTIME_REF: ${{ steps.runtime.outputs.ref }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/cafe-runtime/runtime.oci.tar"
          runtime_sha="$(podman run --pull=never --rm --network none --read-only --cap-drop all \
            --security-opt no-new-privileges --volume "$RUNNER_TEMP/cafe-runtime:/runtime:ro" \
            "$RUNTIME_REF" sha256sum /runtime/runtime.oci.tar | awk '{print $1}')"
          [[ "$runtime_sha" =~ ^[0-9a-f]{64}$ ]]
          mkdir "$RUNNER_TEMP/cafe-output"
          podman run --pull=never --rm --network none --read-only --cap-drop all \
            --security-opt no-new-privileges --pids-limit 512 --memory 4g \
            --cpus 4 --tmpfs /tmp:rw,nosuid,nodev,size=2147483648 \
            --env CAFE_CHECKOUTS_PREVERIFIED=1 \
            --volume "$PWD/trusted:/trusted:ro" \
            --volume "$PWD/candidate:/candidate:ro" \
            --volume "$RUNNER_TEMP/cafe-runtime:/runtime:ro" \
            --volume "$RUNNER_TEMP/cafe-preflight:/preflight:ro" \
            --volume "$RUNNER_TEMP/cafe-output:/output:rw" \
            "$RUNTIME_REF" \
            bash /trusted/tools/trusted_cafe_capture.sh capture \
              /candidate /output/evidence "$CANDIDATE_SHA" "$CANDIDATE_TREE" \
              "$GITHUB_SHA" "$WORKFLOW_TREE" "$GITHUB_REPOSITORY" \
              "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$runtime_sha" \
              /runtime/runtime-build-receipt.json \
              /preflight/cafe-authored-manifest.v1.json
          [[ -z "$(git -C trusted status --porcelain=v1 --untracked-files=all)" ]]
          [[ -z "$(git -C candidate status --porcelain=v1 --untracked-files=all)" ]]
          echo "runtime_sha=$runtime_sha" >> "$GITHUB_OUTPUT"
          bundle_sha="$(podman run --pull=never --rm --network none --read-only --cap-drop all \
            --security-opt no-new-privileges --volume "$RUNNER_TEMP/cafe-output:/output:ro" \
            "$RUNTIME_REF" sha256sum /output/evidence/trusted-cafe-evidence.tar.gz | awk '{print $1}')"
          echo "bundle_sha=$bundle_sha" >> "$GITHUB_OUTPUT"

      - name: Attest exact evidence bundle
        id: attest_evidence
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: ${{ runner.temp }}/cafe-output/evidence/trusted-cafe-evidence.tar.gz

      - name: Independently verify bundle and GitHub provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          CANDIDATE_TREE: ${{ steps.identity.outputs.candidate_tree }}
          WORKFLOW_TREE: ${{ steps.identity.outputs.workflow_tree }}
          RUNTIME_SHA: ${{ steps.capture.outputs.runtime_sha }}
          RUNTIME_REF: ${{ steps.runtime.outputs.ref }}
        run: |
          set -euo pipefail
          podman run --pull=never --rm --read-only --cap-drop all \
            --security-opt no-new-privileges --pids-limit 256 --memory 1g --cpus 2 \
            --tmpfs /tmp:rw,nosuid,nodev,size=536870912 --env GH_TOKEN \
            --volume "$PWD/trusted:/trusted:ro" --volume "$PWD/candidate:/candidate:ro" \
            --volume "$RUNNER_TEMP/cafe-output:/output:rw" \
            --volume "$RUNNER_TEMP/cafe-preflight:/preflight:ro" \
            --volume "$RUNNER_TEMP/cafe-gate-tools:/gate-tools:ro" "$RUNTIME_REF" \
            python -B /trusted/tools/verify_cafe_attested_evidence.py \
              --bundle /output/evidence/trusted-cafe-evidence.tar.gz \
              --candidate-root /candidate --trusted-root /trusted \
              --candidate-sha "$CANDIDATE_SHA" --candidate-tree "$CANDIDATE_TREE" \
              --workflow-sha "$GITHUB_SHA" --workflow-tree "$WORKFLOW_TREE" \
              --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" \
              --run-attempt "$GITHUB_RUN_ATTEMPT" --runtime-archive-sha256 "$RUNTIME_SHA" \
              --preverified-checkouts /preflight/preverified-checkouts.v1.json \
              --compiled-authored-manifest /preflight/cafe-authored-manifest.v1.json \
              --gh-bin /gate-tools/gh_2.98.0_linux_amd64/bin/gh \
              --receipt-output /output/cafe-attested-verification-receipt.json

      - name: Enforce frame, retention, and total artifact budgets
        shell: bash
        env:
          RUNTIME_REF: ${{ steps.runtime.outputs.ref }}
        run: |
          set -euo pipefail
          podman run --pull=never --rm --network none --read-only --cap-drop all \
            --security-opt no-new-privileges --pids-limit 64 --memory 256m --cpus 1 \
            --tmpfs /tmp:rw,nosuid,nodev,size=67108864 \
            --volume "$PWD/trusted:/trusted:ro" --volume "$RUNNER_TEMP/cafe-runtime:/runtime:ro" \
            --volume "$RUNNER_TEMP/cafe-output:/output:ro" "$RUNTIME_REF" \
            python -B - /trusted/evidence/cafe/runtime-lock.v1.json \
              /runtime/runtime.oci.tar /output/evidence/trusted-cafe-evidence.tar.gz <<'PY'
          import json, os, sys
          lock = json.load(open(sys.argv[1], encoding="utf-8"))
          runtime_size, evidence_size = map(os.path.getsize, sys.argv[2:])
          assert lock["capture_contract"]["frames"] <= lock["limits"]["max_evidence_frames"] <= 12
          assert runtime_size <= lock["limits"]["max_runtime_archive_bytes"]
          assert runtime_size + evidence_size <= lock["limits"]["max_total_artifact_bytes"]
          assert lock["limits"]["hosted_timeout_minutes"] <= 35
          assert lock["limits"]["artifact_retention_days"] >= 90
          PY

      - name: Upload attested runtime archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trusted-cafe-runtime-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/cafe-runtime/runtime.oci.tar
            ${{ runner.temp }}/cafe-runtime/runtime-build-receipt.json
            ${{ runner.temp }}/cafe-runtime/runtime-container-receipt.txt
            ${{ runner.temp }}/cafe-runtime-verification/runtime-attestation-verification.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Upload attested cafe evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trusted-cafe-evidence-${{ inputs.candidate_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/cafe-output/evidence/trusted-cafe-evidence.tar.gz
            ${{ runner.temp }}/cafe-output/evidence/trusted-cafe-manifest.json
            ${{ runner.temp }}/cafe-output/cafe-attested-verification-receipt.json
            ${{ runner.temp }}/cafe-preflight/preverified-checkouts.v1.json
            ${{ runner.temp }}/cafe-preflight/cafe-authored-manifest.v1.json
            ${{ runner.temp }}/cafe-selftest-a/receipt.json
            ${{ runner.temp }}/cafe-selftest-b/receipt.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Publish hash-bound handoff summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '### Trusted cafe source-to-capture attestation v1'
            echo
            echo "- candidate SHA/tree: ${{ inputs.candidate_sha }} / ${{ steps.identity.outputs.candidate_tree }}"
            echo "- protected workflow SHA/tree: $GITHUB_SHA / ${{ steps.identity.outputs.workflow_tree }}"
            echo "- runtime OCI archive SHA-256: ${{ steps.capture.outputs.runtime_sha }}"
            echo "- evidence bundle SHA-256: ${{ steps.capture.outputs.bundle_sha }}"
            echo "- runtime attestation: ${{ steps.attest_runtime.outputs.attestation-url }}"
            echo "- evidence attestation: ${{ steps.attest_evidence.outputs.attestation-url }}"
            echo '- authority: evidence only; never Sim/navigation/collision/save/replay/portal/canon authority'
          } >> "$GITHUB_STEP_SUMMARY"
