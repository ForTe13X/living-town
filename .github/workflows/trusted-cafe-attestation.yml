name: Trusted cafe source attestation

on:
  pull_request:
    branches: [master]
    paths:
      - .github/workflows/trusted-cafe-attestation.yml
      - tools/trusted_cafe_capture.sh
      - tools/cafe_authored_manifest.py
      - tools/verify_cafe_attested_evidence.py
      - tools/cafe_attestation_selftest.py
      - evidence/cafe/runtime-lock.v1.json
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full same-repository candidate commit SHA to capture
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: trusted-cafe-${{ github.event_name }}-${{ inputs.candidate_sha || github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  pull_request_runtime_qualification:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: trusted
          persist-credentials: false

      - name: Enforce the six-path Stack A lease
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "$(git -C trusted rev-parse HEAD)" == "$HEAD_SHA" ]]
          [[ -z "$(git -C trusted status --porcelain=v1 --untracked-files=all)" ]]
          mapfile -t changed < <(git -C trusted diff --name-only "$BASE_SHA" "$HEAD_SHA")
          ((${#changed[@]} > 0))
          for path in "${changed[@]}"; do
            case "$path" in
              .github/workflows/trusted-cafe-attestation.yml|\
              tools/trusted_cafe_capture.sh|\
              tools/cafe_authored_manifest.py|\
              tools/verify_cafe_attested_evidence.py|\
              tools/cafe_attestation_selftest.py|\
              evidence/cafe/runtime-lock.v1.json) ;;
              *) echo "out-of-lease path: $path" >&2; exit 1 ;;
            esac
          done
          [[ "${#changed[@]}" -eq 6 ]]

      - name: Build the immutable runtime twice
        shell: bash
        run: |
          set -euo pipefail
          bash trusted/tools/trusted_cafe_capture.sh build-runtime \
            trusted "$RUNNER_TEMP/cafe-runtime"

      - name: Load and qualify the exact digest runtime
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/cafe-runtime/runtime.oci.tar"
          receipt="$RUNNER_TEMP/cafe-runtime/runtime-build-receipt.json"
          validation_archive="$RUNNER_TEMP/cafe-runtime/validation.oci.tar"
          validation_receipt="$RUNNER_TEMP/cafe-runtime/validation-build-receipt.json"
          manifest_digest="$(sed -n 's/.*"oci_manifest_digest":"\([0-9a-f]\{64\}\)".*/\1/p' "$receipt")"
          runtime_archive_sha="$(sed -n 's/.*"runtime_archive_sha256":"\([0-9a-f]\{64\}\)".*/\1/p' "$receipt")"
          runtime_validation_digest="$(sed -n 's/.*"validation_oci_manifest_digest":"\([0-9a-f]\{64\}\)".*/\1/p' "$receipt")"
          validation_digest="$(sed -n 's/.*"validation_oci_manifest_digest":"\([0-9a-f]\{64\}\)".*/\1/p' "$validation_receipt")"
          validation_archive_sha="$(sed -n 's/.*"validation_archive_sha256":"\([0-9a-f]\{64\}\)".*/\1/p' "$validation_receipt")"
          validation_delta_sha="$(sed -n 's/.*"validation_delta_archive_sha256":"\([0-9a-f]\{64\}\)".*/\1/p' "$validation_receipt")"
          paired_runtime_sha="$(sed -n 's/.*"runtime_archive_sha256":"\([0-9a-f]\{64\}\)".*/\1/p' "$validation_receipt")"
          [[ "$manifest_digest" =~ ^[0-9a-f]{64}$ ]]
          [[ "$runtime_archive_sha" =~ ^[0-9a-f]{64}$ ]]
          [[ "$validation_digest" =~ ^[0-9a-f]{64}$ ]]
          [[ "$validation_archive_sha" =~ ^[0-9a-f]{64}$ ]]
          [[ "$validation_delta_sha" =~ ^[0-9a-f]{64}$ ]]
          [[ "$runtime_validation_digest" == "$validation_digest" ]]
          [[ "$paired_runtime_sha" == "$runtime_archive_sha" ]]
          podman image rm -f localhost/living-town/trusted-cafe-runtime:v1 \
            localhost/living-town/trusted-cafe-validation:v1 >/dev/null 2>&1 || true
          podman load --input "$archive"
          runtime_ref="localhost/living-town/trusted-cafe-runtime@sha256:$manifest_digest"
          validation_ref="localhost/living-town/trusted-cafe-validation@sha256:$validation_digest"
          podman image exists "$runtime_ref"
          actual_runtime_sha="$(podman run --pull=never --rm --network none --read-only --cap-drop all \
            --security-opt no-new-privileges --volume "$RUNNER_TEMP/cafe-runtime:/runtime:ro" \
            "$runtime_ref" sha256sum /runtime/runtime.oci.tar | awk '{print $1}')"
          actual_validation_sha="$(podman run --pull=never --rm --network none --read-only --cap-drop all \
            --security-opt no-new-privileges --volume "$RUNNER_TEMP/cafe-runtime:/runtime:ro" \
            "$runtime_ref" sha256sum /runtime/validation.oci.tar | awk '{print $1}')"
          actual_validation_delta_sha="$(podman run --pull=never --rm --network none --read-only --cap-drop all \
            --security-opt no-new-privileges --volume "$RUNNER_TEMP/cafe-runtime:/runtime:ro" \
            "$runtime_ref" sha256sum /runtime/validation.delta.oci.tar | awk '{print $1}')"
          [[ "$actual_runtime_sha" == "$runtime_archive_sha" ]]
          [[ "$actual_validation_sha" == "$validation_archive_sha" ]]
          [[ "$actual_validation_delta_sha" == "$validation_delta_sha" ]]
          podman load --input "$validation_archive"
          podman image exists "$validation_ref"
          if podman run --pull=never --rm \
            "localhost/living-town/trusted-cafe-runtime@sha256:$(printf '0%.0s' {1..64})" true; then
            echo 'wrong runtime digest executed' >&2
            exit 1
          fi
          if podman run --pull=never --rm \
            "localhost/living-town/trusted-cafe-validation@sha256:$(printf '0%.0s' {1..64})" true; then
            echo 'wrong validation digest executed' >&2
            exit 1
          fi
          if podman run --pull=never --rm --network none --read-only --cap-drop all \
            --security-opt no-new-privileges --volume "$PWD/trusted:/trusted:ro" \
            "$runtime_ref" touch /trusted/.write-must-fail; then
            echo 'read-only trusted mount accepted a write' >&2
            exit 1
          fi
          {
            printf 'runtime_ref=%s\n' "$runtime_ref"
            printf 'validation_ref=%s\n' "$validation_ref"
            printf 'runtime_archive_sha256=%s\n' "$actual_runtime_sha"
            printf 'validation_archive_sha256=%s\n' "$actual_validation_sha"
            printf 'validation_delta_archive_sha256=%s\n' "$actual_validation_delta_sha"
            printf 'podman=%s\n' "$(podman --version)"
            printf 'docker_context=%s\n' "$(docker context show)"
            printf 'platform=linux/amd64 network=none read_only=true cap_drop=ALL no_new_privileges=true\n'
            printf 'trusted_mount=read-only scratch=runner-temp-task-owned cache=none cleanup=--rm\n'
            printf 'material_commands=selftest-twice,receipt-compare,runtime-smoke,archive-budget\n'
            docker version --format 'docker_client={{.Client.Version}} docker_server={{.Server.Version}} docker_os={{.Server.Os}} docker_arch={{.Server.Arch}}'
            podman run --pull=never --rm --network none --read-only --cap-drop all \
              --security-opt no-new-privileges --pids-limit 128 --memory 768m --cpus 2 \
              --tmpfs /tmp:rw,nosuid,nodev,size=268435456 "$runtime_ref" \
              python -B -c 'import PIL,platform; print(platform.python_version(), PIL.__version__)'
            podman run --pull=never --rm --network none --read-only --cap-drop all \
              --security-opt no-new-privileges --pids-limit 128 --memory 768m --cpus 2 \
              --tmpfs /tmp:rw,nosuid,nodev,size=268435456 "$runtime_ref" \
              godot --version
          } | tee "$RUNNER_TEMP/runtime-container-receipt.txt"
          echo "ref=$runtime_ref" >> "$GITHUB_OUTPUT"
          echo "validation_ref=$validation_ref" >> "$GITHUB_OUTPUT"

      - name: Run two fresh isolated trust-root self-tests
        shell: bash
        env:
          VALIDATION_REF: ${{ steps.runtime.outputs.validation_ref }}
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/cafe-selftest-a" "$RUNNER_TEMP/cafe-selftest-b"
          for lane in a b; do
            podman run --pull=never --rm --name "cafe-selftest-${lane}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
              --network none --read-only --cap-drop all --security-opt no-new-privileges \
              --pids-limit 256 --memory 1g --cpus 2 \
              --tmpfs /tmp:rw,nosuid,nodev,size=536870912 \
              --volume "$PWD/trusted:/trusted:ro" \
              --volume "$RUNNER_TEMP/cafe-selftest-${lane}:/scratch:rw" \
              --workdir /trusted "$VALIDATION_REF" \
              python -B tools/cafe_attestation_selftest.py \
                --work-dir /scratch/work --receipt /scratch/receipt.json
          done
          podman run --pull=never --rm --network none --read-only --cap-drop all \
            --security-opt no-new-privileges --pids-limit 64 --memory 256m --cpus 1 \
            --volume "$RUNNER_TEMP/cafe-selftest-a:/a:ro" \
            --volume "$RUNNER_TEMP/cafe-selftest-b:/b:ro" "$VALIDATION_REF" \
            cmp /a/receipt.json /b/receipt.json

      - name: Enforce hosted artifact budget in the exact runtime
        shell: bash
        env:
          RUNTIME_REF: ${{ steps.runtime.outputs.ref }}
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/cafe-budget"
          receipt="$RUNNER_TEMP/cafe-budget/qualification-budget-receipt.json"
          # stdin-loss-negative-control: without --interactive the body cannot create its receipt.
          if (
            podman run --pull=never --rm --network none --read-only --cap-drop all \
              --security-opt no-new-privileges --pids-limit 32 --memory 128m --cpus 1 \
              --volume "$RUNNER_TEMP/cafe-budget:/budget:rw" "$RUNTIME_REF" \
              python -B - /budget/stdin-loss.json <<'PY'
          open(__import__("sys").argv[1], "wb").write(b"must-not-run\n")
          PY
            test -s "$RUNNER_TEMP/cafe-budget/stdin-loss.json"
          ); then
            echo 'budget stdin-loss negative control unexpectedly executed' >&2
            exit 1
          fi
          test ! -e "$RUNNER_TEMP/cafe-budget/stdin-loss.json"
          podman run --pull=never --rm --interactive --network none --read-only --cap-drop all \
            --security-opt no-new-privileges --pids-limit 64 --memory 256m --cpus 1 \
            --tmpfs /tmp:rw,nosuid,nodev,size=67108864 \
            --volume "$PWD/trusted:/trusted:ro" \
            --volume "$RUNNER_TEMP/cafe-runtime:/runtime:ro" \
            --volume "$RUNNER_TEMP/cafe-selftest-a:/selftest-a:ro" \
            --volume "$RUNNER_TEMP/cafe-selftest-b:/selftest-b:ro" \
            --volume "$RUNNER_TEMP:/runner:ro" \
            --volume "$RUNNER_TEMP/cafe-budget:/budget:rw" "$RUNTIME_REF" \
            python -B - /trusted/evidence/cafe/runtime-lock.v1.json \
              /budget/qualification-budget-receipt.json <<'PY'
          import hashlib, json, os, sys, tempfile

          lock_path, output = sys.argv[1:]
          lock = json.load(open(lock_path, encoding="utf-8"))
          limits = lock["limits"]

          def sha256(path):
              value = hashlib.sha256()
              with open(path, "rb") as source:
                  for block in iter(lambda: source.read(1024 * 1024), b""):
                      value.update(block)
              return value.hexdigest()

          def record(path, name):
              return {"bytes": os.path.getsize(path), "path": name, "sha256": sha256(path)}

          archives = {
              "runtime": record("/runtime/runtime.oci.tar", "runtime.oci.tar"),
              "validation": record("/runtime/validation.oci.tar", "validation.oci.tar"),
              "validation_delta": record(
                  "/runtime/validation.delta.oci.tar", "validation.delta.oci.tar"
              ),
          }
          runtime_receipt = json.load(open("/runtime/runtime-build-receipt.json", encoding="utf-8"))
          validation_receipt = json.load(
              open("/runtime/validation-build-receipt.json", encoding="utf-8")
          )
          assert runtime_receipt["runtime_archive_sha256"] == archives["runtime"]["sha256"]
          assert validation_receipt["validation_archive_sha256"] == archives["validation"]["sha256"]
          assert validation_receipt["validation_archive_bytes"] == archives["validation"]["bytes"]
          assert (
              validation_receipt["validation_delta_archive_sha256"]
              == archives["validation_delta"]["sha256"]
          )
          assert (
              validation_receipt["validation_delta_archive_bytes"]
              == archives["validation_delta"]["bytes"]
          )
          assert (
              validation_receipt["validation_delta_reconstruction"]
              == "runtime.oci.tar+validation.delta.oci.tar"
          )
          assert archives["runtime"]["bytes"] <= limits["max_runtime_archive_bytes"]
          assert archives["validation"]["bytes"] <= limits["max_validation_archive_bytes"]
          assert (
              archives["validation_delta"]["bytes"]
              <= limits["max_validation_delta_archive_bytes"]
          )
          payloads = [
              archives["runtime"],
              record("/runtime/runtime-build-receipt.json", "runtime-build-receipt.json"),
              archives["validation_delta"],
              record("/runtime/validation-build-receipt.json", "validation-build-receipt.json"),
              record("/selftest-a/receipt.json", "selftest-a/receipt.json"),
              record("/selftest-b/receipt.json", "selftest-b/receipt.json"),
              record("/runner/runtime-container-receipt.txt", "runtime-container-receipt.txt"),
          ]
          payload_bytes = sum(item["bytes"] for item in payloads)
          assert payload_bytes <= limits["max_qualification_payload_bytes"]
          assert limits["max_qualification_payload_bytes"] < limits["max_total_artifact_bytes"]
          assert limits["hosted_timeout_minutes"] <= 35
          assert limits["artifact_retention_days"] >= 90
          value = {
              "archives": archives,
              "limits": {
                  key: limits[key]
                  for key in (
                      "max_qualification_payload_bytes",
                      "max_runtime_archive_bytes",
                      "max_total_artifact_bytes",
                      "max_validation_archive_bytes",
                      "max_validation_delta_archive_bytes",
                  )
              },
              "payload_bytes_excluding_receipt": payload_bytes,
              "payloads": sorted(payloads, key=lambda item: item["path"]),
              "schema": "living-town.cafe-qualification-budget-receipt.v1",
              "stdin_loss_negative_control": "passed",
              "stdin_received": True,
          }
          data = (json.dumps(value, sort_keys=True, separators=(",", ":")) + "\n").encode("ascii")
          fd, temporary = tempfile.mkstemp(prefix=".qualification-budget-", dir=os.path.dirname(output))
          with os.fdopen(fd, "wb") as stream:
              stream.write(data)
          os.replace(temporary, output)
          print(data.decode("ascii"), end="")
          PY
          test -s "$receipt"
          podman run --pull=never --rm --network none --read-only --cap-drop all \
            --security-opt no-new-privileges --pids-limit 32 --memory 128m --cpus 1 \
            --volume "$RUNNER_TEMP/cafe-budget:/budget:ro" "$RUNTIME_REF" \
            python -B -c 'import json,pathlib,sys; p=pathlib.Path(sys.argv[1]); v=json.loads(p.read_text(encoding="ascii")); assert v["schema"]=="living-town.cafe-qualification-budget-receipt.v1"; assert p.read_bytes()==(json.dumps(v,sort_keys=True,separators=(",",":"))+"\n").encode("ascii")' \
              /budget/qualification-budget-receipt.json

      - name: Upload reproducible runtime qualification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cafe-runtime-qualification-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/cafe-runtime/runtime.oci.tar
            ${{ runner.temp }}/cafe-runtime/runtime-build-receipt.json
            ${{ runner.temp }}/cafe-runtime/validation.delta.oci.tar
            ${{ runner.temp }}/cafe-runtime/validation-build-receipt.json
            ${{ runner.temp }}/cafe-selftest-a/receipt.json
            ${{ runner.temp }}/cafe-selftest-b/receipt.json
            ${{ runner.temp }}/runtime-container-receipt.txt
            ${{ runner.temp }}/cafe-budget/qualification-budget-receipt.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  protected_capture_and_attestation:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: Require protected default-branch workflow identity
        shell: bash
        env:
          EXPECTED_WORKFLOW_REF: ForTe13X/living-town/.github/workflows/trusted-cafe-attestation.yml@refs/heads/master
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == "ForTe13X/living-town" ]]
          [[ "$GITHUB_REF" == "refs/heads/master" ]]
          [[ "$GITHUB_WORKFLOW_REF" == "$EXPECTED_WORKFLOW_REF" ]]
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]

      - name: Checkout protected trust root
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          path: trusted
          persist-credentials: false

      - name: Checkout exact same-repository candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
          path: candidate
          persist-credentials: false

      - name: Verify checkout identities
        id: identity
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          [[ "$(git -C trusted rev-parse HEAD)" == "$GITHUB_SHA" ]]
          [[ "$(git -C candidate rev-parse HEAD)" == "$CANDIDATE_SHA" ]]
          [[ -z "$(git -C trusted status --porcelain=v1 --untracked-files=all)" ]]
          [[ -z "$(git -C candidate status --porcelain=v1 --untracked-files=all)" ]]
          echo "candidate_tree=$(git -C candidate show -s --format='%T' HEAD)" >> "$GITHUB_OUTPUT"
          echo "workflow_tree=$(git -C trusted show -s --format='%T' HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build the immutable runtime twice
        shell: bash
        run: |
          set -euo pipefail
          bash trusted/tools/trusted_cafe_capture.sh build-runtime \
            trusted "$RUNNER_TEMP/cafe-runtime"

      - name: Attest exact runtime OCI archive
        id: attest_runtime
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: ${{ runner.temp }}/cafe-runtime/runtime.oci.tar

      - name: Attest exact validation OCI archive
        id: attest_validation
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: ${{ runner.temp }}/cafe-runtime/validation.oci.tar

      - name: Verify archive attestations before subject load in pinned bootstrap
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BOOTSTRAP_IMAGE: docker.io/library/python@sha256:2fc9207f64226cb05ac317cee0bab6fa55a9ea311ce5a086baddd4b4a83c2d3c
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/cafe-gate-tools" "$RUNNER_TEMP/cafe-runtime-verification"
          docker run --pull=always --rm --interactive --platform linux/amd64 \
            --read-only --cap-drop all --security-opt no-new-privileges \
            --pids-limit 128 --memory 512m --cpus 1 \
            --tmpfs /tmp:rw,nosuid,nodev,size=134217728 --env GH_TOKEN \
            --env GITHUB_REPOSITORY --env GITHUB_SHA \
            --volume "$PWD/trusted:/trusted:ro" \
            --volume "$RUNNER_TEMP/cafe-runtime:/runtime:ro" \
            --volume "$RUNNER_TEMP/cafe-gate-tools:/gate-tools:rw" \
            --volume "$RUNNER_TEMP/cafe-runtime-verification:/verification:rw" \
            "$BOOTSTRAP_IMAGE" bash -euo pipefail <<'BOOTSTRAP'
          python -B -c 'import hashlib,pathlib,urllib.request; p=pathlib.Path("/gate-tools/gh.tar.gz"); p.write_bytes(urllib.request.urlopen("https://github.com/cli/cli/releases/download/v2.98.0/gh_2.98.0_linux_amd64.tar.gz",timeout=120).read()); assert hashlib.sha256(p.read_bytes()).hexdigest()=="3b8ac6b30336802fc1a858d7c084e11cdf24ac1a761ca90b68022d7d729208de"'
          python -B -c 'import pathlib,tarfile; a=tarfile.open("/gate-tools/gh.tar.gz","r:gz"); ms=a.getmembers(); assert ms and all((m.isdir() or m.isfile()) and not m.name.startswith("/") and ".." not in pathlib.PurePosixPath(m.name).parts and pathlib.PurePosixPath(m.name).parts[0]=="gh_2.98.0_linux_amd64" for m in ms); a.extractall("/gate-tools",filter="data")'
          test "$(/gate-tools/gh_2.98.0_linux_amd64/bin/gh --version | awk 'NR==1 {print $3}')" = 2.98.0
          /gate-tools/gh_2.98.0_linux_amd64/bin/gh attestation verify /runtime/runtime.oci.tar \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/trusted-cafe-attestation.yml" \
            --signer-digest "$GITHUB_SHA" --source-digest "$GITHUB_SHA" \
            --source-ref refs/heads/master --cert-oidc-issuer https://token.actions.githubusercontent.com \
            --deny-self-hosted-runners --predicate-type https://slsa.dev/provenance/v1 \
            --format json > /verification/runtime-attestation-verification.json
          /gate-tools/gh_2.98.0_linux_amd64/bin/gh attestation verify /runtime/validation.oci.tar \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/trusted-cafe-attestation.yml" \
            --signer-digest "$GITHUB_SHA" --source-digest "$GITHUB_SHA" \
            --source-ref refs/heads/master --cert-oidc-issuer https://token.actions.githubusercontent.com \
            --deny-self-hosted-runners --predicate-type https://slsa.dev/provenance/v1 \
            --format json > /verification/validation-attestation-verification.json
          python -B /trusted/tools/verify_cafe_attested_evidence.py --archive-bootstrap \
            --runtime-archive /runtime/runtime.oci.tar \
            --runtime-attestation /verification/runtime-attestation-verification.json \
            --validation-archive /runtime/validation.oci.tar \
            --validation-attestation /verification/validation-attestation-verification.json \
            --repository "$GITHUB_REPOSITORY" --workflow-sha "$GITHUB_SHA" \
            --receipt-output /verification/archive-bootstrap-receipt.json
          grep -F '"subject_load_count_before_verification":0' /verification/archive-bootstrap-receipt.json
          BOOTSTRAP
          test -s "$RUNNER_TEMP/cafe-runtime-verification/archive-bootstrap-receipt.json"

      - name: Load the attested exact-digest subjects
        id: runtime
        shell: bash
        env:
          BOOTSTRAP_IMAGE: docker.io/library/python@sha256:2fc9207f64226cb05ac317cee0bab6fa55a9ea311ce5a086baddd4b4a83c2d3c
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/cafe-runtime-verification/archive-bootstrap-receipt.json"
          docker run --pull=never --rm --platform linux/amd64 --network none --read-only \
            --cap-drop all --security-opt no-new-privileges --pids-limit 32 --memory 128m --cpus 1 \
            --volume "$RUNNER_TEMP/cafe-runtime:/runtime:ro" \
            --volume "$RUNNER_TEMP/cafe-runtime-verification:/verification:ro" \
            "$BOOTSTRAP_IMAGE" python -B -c 'import hashlib,json,pathlib; r=pathlib.Path("/verification/archive-bootstrap-receipt.json"); v=json.loads(r.read_text(encoding="ascii")); assert r.read_bytes()==(json.dumps(v,sort_keys=True,separators=(",",":"))+"\n").encode("ascii"); assert v["verified"] is True and v["subject_load_count_before_verification"]==0 and v["subject_token_exposed"] is False; by={x["role"]:x for x in v["archives"]}; assert hashlib.sha256(pathlib.Path("/runtime/runtime.oci.tar").read_bytes()).hexdigest()==by["runtime"]["sha256"]; assert hashlib.sha256(pathlib.Path("/runtime/validation.oci.tar").read_bytes()).hexdigest()==by["validation"]["sha256"]'
          receipt="$RUNNER_TEMP/cafe-runtime/runtime-build-receipt.json"
          validation_receipt="$RUNNER_TEMP/cafe-runtime/validation-build-receipt.json"
          manifest_digest="$(sed -n 's/.*"oci_manifest_digest":"\([0-9a-f]\{64\}\)".*/\1/p' "$receipt")"
          runtime_archive_sha="$(sed -n 's/.*"runtime_archive_sha256":"\([0-9a-f]\{64\}\)".*/\1/p' "$receipt")"
          runtime_validation_digest="$(sed -n 's/.*"validation_oci_manifest_digest":"\([0-9a-f]\{64\}\)".*/\1/p' "$receipt")"
          validation_digest="$(sed -n 's/.*"validation_oci_manifest_digest":"\([0-9a-f]\{64\}\)".*/\1/p' "$validation_receipt")"
          validation_archive_sha="$(sed -n 's/.*"validation_archive_sha256":"\([0-9a-f]\{64\}\)".*/\1/p' "$validation_receipt")"
          validation_delta_sha="$(sed -n 's/.*"validation_delta_archive_sha256":"\([0-9a-f]\{64\}\)".*/\1/p' "$validation_receipt")"
          paired_runtime_sha="$(sed -n 's/.*"runtime_archive_sha256":"\([0-9a-f]\{64\}\)".*/\1/p' "$validation_receipt")"
          [[ "$manifest_digest" =~ ^[0-9a-f]{64}$ ]]
          [[ "$runtime_archive_sha" =~ ^[0-9a-f]{64}$ ]]
          [[ "$validation_digest" =~ ^[0-9a-f]{64}$ ]]
          [[ "$validation_archive_sha" =~ ^[0-9a-f]{64}$ ]]
          [[ "$validation_delta_sha" =~ ^[0-9a-f]{64}$ ]]
          [[ "$runtime_validation_digest" == "$validation_digest" ]]
          [[ "$paired_runtime_sha" == "$runtime_archive_sha" ]]
          podman image rm -f localhost/living-town/trusted-cafe-runtime:v1 \
            localhost/living-town/trusted-cafe-validation:v1 >/dev/null 2>&1 || true
          podman load --input "$RUNNER_TEMP/cafe-runtime/runtime.oci.tar"
          runtime_ref="localhost/living-town/trusted-cafe-runtime@sha256:$manifest_digest"
          validation_ref="localhost/living-town/trusted-cafe-validation@sha256:$validation_digest"
          podman image exists "$runtime_ref"
          actual_runtime_sha="$(podman run --pull=never --rm --network none --read-only --cap-drop all \
            --security-opt no-new-privileges --volume "$RUNNER_TEMP/cafe-runtime:/runtime:ro" \
            "$runtime_ref" sha256sum /runtime/runtime.oci.tar | awk '{print $1}')"
          actual_validation_sha="$(podman run --pull=never --rm --network none --read-only --cap-drop all \
            --security-opt no-new-privileges --volume "$RUNNER_TEMP/cafe-runtime:/runtime:ro" \
            "$runtime_ref" sha256sum /runtime/validation.oci.tar | awk '{print $1}')"
          actual_validation_delta_sha="$(podman run --pull=never --rm --network none --read-only --cap-drop all \
            --security-opt no-new-privileges --volume "$RUNNER_TEMP/cafe-runtime:/runtime:ro" \
            "$runtime_ref" sha256sum /runtime/validation.delta.oci.tar | awk '{print $1}')"
          [[ "$actual_runtime_sha" == "$runtime_archive_sha" ]]
          [[ "$actual_validation_sha" == "$validation_archive_sha" ]]
          [[ "$actual_validation_delta_sha" == "$validation_delta_sha" ]]
          podman load --input "$RUNNER_TEMP/cafe-runtime/validation.oci.tar"
          podman image exists "$validation_ref"
          if podman run --pull=never --rm \
            "localhost/living-town/trusted-cafe-runtime@sha256:$(printf '0%.0s' {1..64})" true; then
            echo 'wrong runtime digest executed' >&2
            exit 1
          fi
          if podman run --pull=never --rm \
            "localhost/living-town/trusted-cafe-validation@sha256:$(printf '0%.0s' {1..64})" true; then
            echo 'wrong validation digest executed' >&2
            exit 1
          fi
          {
            printf 'runtime_ref=%s\n' "$runtime_ref"
            printf 'validation_ref=%s\n' "$validation_ref"
            printf 'runtime_archive_sha256=%s\n' "$actual_runtime_sha"
            printf 'validation_archive_sha256=%s\n' "$actual_validation_sha"
            printf 'validation_delta_archive_sha256=%s\n' "$actual_validation_delta_sha"
            printf 'podman=%s\n' "$(podman --version)"
            printf 'docker_context=%s\n' "$(docker context show)"
            docker version --format 'docker_client={{.Client.Version}} docker_server={{.Server.Version}} docker_os={{.Server.Os}} docker_arch={{.Server.Arch}}'
            printf 'platform=linux/amd64 default_network=none attestation_network=token-scoped\n'
            printf 'read_only=true cap_drop=ALL no_new_privileges=true candidate_mount=read-only trusted_mount=read-only\n'
            printf 'scratch=runner-temp-task-owned cache=none cleanup=--rm\n'
            printf 'material_commands=selftest-twice,authored-compile,runtime-attestation,capture,evidence-verification,budgets\n'
          } > "$RUNNER_TEMP/cafe-runtime/runtime-container-receipt.txt"
          echo "ref=$runtime_ref" >> "$GITHUB_OUTPUT"
          echo "validation_ref=$validation_ref" >> "$GITHUB_OUTPUT"

      - name: Run two fresh isolated trust-root self-tests
        shell: bash
        env:
          VALIDATION_REF: ${{ steps.runtime.outputs.validation_ref }}
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/cafe-selftest-a" "$RUNNER_TEMP/cafe-selftest-b"
          for lane in a b; do
            podman run --pull=never --rm --name "cafe-selftest-${lane}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
              --network none --read-only --cap-drop all --security-opt no-new-privileges \
              --pids-limit 256 --memory 1g --cpus 2 \
              --tmpfs /tmp:rw,nosuid,nodev,size=536870912 \
              --volume "$PWD/trusted:/trusted:ro" \
              --volume "$RUNNER_TEMP/cafe-selftest-${lane}:/scratch:rw" \
              --workdir /trusted "$VALIDATION_REF" python -B tools/cafe_attestation_selftest.py \
                --work-dir /scratch/work --receipt /scratch/receipt.json
          done
          podman run --pull=never --rm --network none --read-only --cap-drop all \
            --security-opt no-new-privileges --volume "$RUNNER_TEMP/cafe-selftest-a:/a:ro" \
            --volume "$RUNNER_TEMP/cafe-selftest-b:/b:ro" "$VALIDATION_REF" \
            cmp /a/receipt.json /b/receipt.json

      - name: Compile candidate source inside the exact runtime
        shell: bash
        env:
          VALIDATION_REF: ${{ steps.runtime.outputs.validation_ref }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          CANDIDATE_TREE: ${{ steps.identity.outputs.candidate_tree }}
          WORKFLOW_TREE: ${{ steps.identity.outputs.workflow_tree }}
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/cafe-preflight"
          podman run --pull=never --rm --network none --read-only --cap-drop all \
            --security-opt no-new-privileges --pids-limit 128 --memory 768m --cpus 2 \
            --tmpfs /tmp:rw,nosuid,nodev,size=268435456 \
            --volume "$PWD/trusted:/trusted:ro" --volume "$PWD/candidate:/candidate:ro" \
            --volume "$RUNNER_TEMP/cafe-preflight:/preflight:rw" \
            --env CANDIDATE_SHA --env CANDIDATE_TREE --env GITHUB_REPOSITORY --env GITHUB_SHA \
            --env WORKFLOW_TREE "$VALIDATION_REF" bash -euo pipefail -c '
              cmp -s /candidate/evidence/cafe/cafe-authored-ids.v1.json /trusted/evidence/cafe/cafe-authored-ids.v1.json
              cmp -s /candidate/evidence/cafe/cafe-authored-manifest.v1.json /trusted/evidence/cafe/cafe-authored-manifest.v1.json
              python -B /trusted/tools/cafe_authored_manifest.py --repo /candidate \
                --ids /trusted/evidence/cafe/cafe-authored-ids.v1.json \
                --check /trusted/evidence/cafe/cafe-authored-manifest.v1.json \
                --output /preflight/cafe-authored-manifest.v1.json
              cmp -s /preflight/cafe-authored-manifest.v1.json /trusted/evidence/cafe/cafe-authored-manifest.v1.json
              authored_sha="$(sha256sum /preflight/cafe-authored-manifest.v1.json | awk "{print \$1}")"
              printf "{\"authored_manifest_sha256\":\"%s\",\"candidate\":{\"clean\":true,\"sha\":\"%s\",\"tree\":\"%s\"},\"repository\":\"%s\",\"schema\":\"living-town.cafe-preverified-checkouts.v1\",\"source\":\"host-read-only-git\",\"workflow\":{\"clean\":true,\"sha\":\"%s\",\"tree\":\"%s\"}}\n" \
                "$authored_sha" "$CANDIDATE_SHA" "$CANDIDATE_TREE" "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$WORKFLOW_TREE" \
                > /preflight/preverified-checkouts.v1.json
              ! touch /trusted/.write-must-fail
              ! touch /candidate/.write-must-fail
            '

      - name: Load attested archive and capture exact candidate
        id: capture
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          CANDIDATE_TREE: ${{ steps.identity.outputs.candidate_tree }}
          WORKFLOW_TREE: ${{ steps.identity.outputs.workflow_tree }}
          RUNTIME_REF: ${{ steps.runtime.outputs.ref }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/cafe-runtime/runtime.oci.tar"
          runtime_sha="$(podman run --pull=never --rm --network none --read-only --cap-drop all \
            --security-opt no-new-privileges --volume "$RUNNER_TEMP/cafe-runtime:/runtime:ro" \
            "$RUNTIME_REF" sha256sum /runtime/runtime.oci.tar | awk '{print $1}')"
          [[ "$runtime_sha" =~ ^[0-9a-f]{64}$ ]]
          mkdir "$RUNNER_TEMP/cafe-output"
          podman run --pull=never --rm --network none --read-only --cap-drop all \
            --security-opt no-new-privileges --pids-limit 512 --memory 4g \
            --cpus 4 --tmpfs /tmp:rw,nosuid,nodev,size=2147483648 \
            --env CAFE_CHECKOUTS_PREVERIFIED=1 \
            --volume "$PWD/trusted:/trusted:ro" \
            --volume "$PWD/candidate:/candidate:ro" \
            --volume "$RUNNER_TEMP/cafe-runtime:/runtime:ro" \
            --volume "$RUNNER_TEMP/cafe-preflight:/preflight:ro" \
            --volume "$RUNNER_TEMP/cafe-output:/output:rw" \
            "$RUNTIME_REF" \
            bash /trusted/tools/trusted_cafe_capture.sh capture \
              /candidate /output/evidence "$CANDIDATE_SHA" "$CANDIDATE_TREE" \
              "$GITHUB_SHA" "$WORKFLOW_TREE" "$GITHUB_REPOSITORY" \
              "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$runtime_sha" \
              /runtime/runtime-build-receipt.json \
              /preflight/cafe-authored-manifest.v1.json
          [[ -z "$(git -C trusted status --porcelain=v1 --untracked-files=all)" ]]
          [[ -z "$(git -C candidate status --porcelain=v1 --untracked-files=all)" ]]
          echo "runtime_sha=$runtime_sha" >> "$GITHUB_OUTPUT"
          bundle_sha="$(podman run --pull=never --rm --network none --read-only --cap-drop all \
            --security-opt no-new-privileges --volume "$RUNNER_TEMP/cafe-output:/output:ro" \
            "$RUNTIME_REF" sha256sum /output/evidence/trusted-cafe-evidence.tar.gz | awk '{print $1}')"
          echo "bundle_sha=$bundle_sha" >> "$GITHUB_OUTPUT"

      - name: Attest exact evidence bundle
        id: attest_evidence
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: ${{ runner.temp }}/cafe-output/evidence/trusted-cafe-evidence.tar.gz

      - name: Verify evidence attestation in the token-scoped pinned bootstrap
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BOOTSTRAP_IMAGE: docker.io/library/python@sha256:2fc9207f64226cb05ac317cee0bab6fa55a9ea311ce5a086baddd4b4a83c2d3c
        run: |
          set -euo pipefail
          docker run --pull=never --rm --platform linux/amd64 --read-only --cap-drop all \
            --security-opt no-new-privileges --pids-limit 64 --memory 256m --cpus 1 \
            --tmpfs /tmp:rw,nosuid,nodev,size=67108864 --env GH_TOKEN \
            --env GITHUB_REPOSITORY --env GITHUB_SHA \
            --volume "$RUNNER_TEMP/cafe-output:/output:ro" \
            --volume "$RUNNER_TEMP/cafe-gate-tools:/gate-tools:ro" \
            --volume "$RUNNER_TEMP/cafe-runtime-verification:/verification:rw" \
            "$BOOTSTRAP_IMAGE" bash -euo pipefail -c '
              /gate-tools/gh_2.98.0_linux_amd64/bin/gh attestation verify \
                /output/evidence/trusted-cafe-evidence.tar.gz \
                --repo "$GITHUB_REPOSITORY" \
                --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/trusted-cafe-attestation.yml" \
                --signer-digest "$GITHUB_SHA" --source-digest "$GITHUB_SHA" \
                --source-ref refs/heads/master --cert-oidc-issuer https://token.actions.githubusercontent.com \
                --deny-self-hosted-runners --predicate-type https://slsa.dev/provenance/v1 \
                --format json > /verification/evidence-attestation-verification.json
              test -s /verification/evidence-attestation-verification.json
            '

      - name: Independently verify bundle and GitHub provenance
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          CANDIDATE_TREE: ${{ steps.identity.outputs.candidate_tree }}
          WORKFLOW_TREE: ${{ steps.identity.outputs.workflow_tree }}
          RUNTIME_SHA: ${{ steps.capture.outputs.runtime_sha }}
          RUNTIME_REF: ${{ steps.runtime.outputs.ref }}
        run: |
          set -euo pipefail
          podman run --pull=never --rm --network none --read-only --cap-drop all \
            --security-opt no-new-privileges --pids-limit 256 --memory 1g --cpus 2 \
            --tmpfs /tmp:rw,nosuid,nodev,size=536870912 \
            --volume "$PWD/trusted:/trusted:ro" --volume "$PWD/candidate:/candidate:ro" \
            --volume "$RUNNER_TEMP/cafe-output:/output:rw" \
            --volume "$RUNNER_TEMP/cafe-preflight:/preflight:ro" \
            --volume "$RUNNER_TEMP/cafe-runtime-verification:/verification:ro" "$RUNTIME_REF" \
            python -B /trusted/tools/verify_cafe_attested_evidence.py \
              --bundle /output/evidence/trusted-cafe-evidence.tar.gz \
              --candidate-root /candidate --trusted-root /trusted \
              --candidate-sha "$CANDIDATE_SHA" --candidate-tree "$CANDIDATE_TREE" \
              --workflow-sha "$GITHUB_SHA" --workflow-tree "$WORKFLOW_TREE" \
              --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" \
              --run-attempt "$GITHUB_RUN_ATTEMPT" --runtime-archive-sha256 "$RUNTIME_SHA" \
              --preverified-checkouts /preflight/preverified-checkouts.v1.json \
              --compiled-authored-manifest /preflight/cafe-authored-manifest.v1.json \
              --attestation-json /verification/evidence-attestation-verification.json \
              --receipt-output /output/cafe-attested-verification-receipt.json

      - name: Enforce frame, retention, and total artifact budgets
        shell: bash
        env:
          RUNTIME_REF: ${{ steps.runtime.outputs.ref }}
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/cafe-budget-protected"
          receipt="$RUNNER_TEMP/cafe-budget-protected/protected-budget-receipt.json"
          # stdin-loss-negative-control: without --interactive the body cannot create its receipt.
          if (
            podman run --pull=never --rm --network none --read-only --cap-drop all \
              --security-opt no-new-privileges --pids-limit 32 --memory 128m --cpus 1 \
              --volume "$RUNNER_TEMP/cafe-budget-protected:/budget:rw" "$RUNTIME_REF" \
              python -B - /budget/stdin-loss.json <<'PY'
          open(__import__("sys").argv[1], "wb").write(b"must-not-run\n")
          PY
            test -s "$RUNNER_TEMP/cafe-budget-protected/stdin-loss.json"
          ); then
            echo 'budget stdin-loss negative control unexpectedly executed' >&2
            exit 1
          fi
          test ! -e "$RUNNER_TEMP/cafe-budget-protected/stdin-loss.json"
          podman run --pull=never --rm --interactive --network none --read-only --cap-drop all \
            --security-opt no-new-privileges --pids-limit 64 --memory 256m --cpus 1 \
            --tmpfs /tmp:rw,nosuid,nodev,size=67108864 \
            --volume "$PWD/trusted:/trusted:ro" --volume "$RUNNER_TEMP/cafe-runtime:/runtime:ro" \
            --volume "$RUNNER_TEMP/cafe-output:/output:ro" \
            --volume "$RUNNER_TEMP/cafe-preflight:/preflight:ro" \
            --volume "$RUNNER_TEMP/cafe-selftest-a:/selftest-a:ro" \
            --volume "$RUNNER_TEMP/cafe-selftest-b:/selftest-b:ro" \
            --volume "$RUNNER_TEMP/cafe-runtime-verification:/runtime-verification:ro" \
            --volume "$RUNNER_TEMP/cafe-budget-protected:/budget:rw" "$RUNTIME_REF" \
            python -B - /trusted/evidence/cafe/runtime-lock.v1.json \
              /budget/protected-budget-receipt.json <<'PY'
          import hashlib, json, os, sys, tempfile

          lock_path, output = sys.argv[1:]
          lock = json.load(open(lock_path, encoding="utf-8"))
          limits = lock["limits"]

          def sha256(path):
              value = hashlib.sha256()
              with open(path, "rb") as source:
                  for block in iter(lambda: source.read(1024 * 1024), b""):
                      value.update(block)
              return value.hexdigest()

          def record(path, name):
              return {"bytes": os.path.getsize(path), "path": name, "sha256": sha256(path)}

          archives = {
              "evidence": record(
                  "/output/evidence/trusted-cafe-evidence.tar.gz", "trusted-cafe-evidence.tar.gz"
              ),
              "runtime": record("/runtime/runtime.oci.tar", "runtime.oci.tar"),
              "validation": record("/runtime/validation.oci.tar", "validation.oci.tar"),
              "validation_delta": record(
                  "/runtime/validation.delta.oci.tar", "validation.delta.oci.tar"
              ),
          }
          runtime_receipt = json.load(open("/runtime/runtime-build-receipt.json", encoding="utf-8"))
          validation_receipt = json.load(
              open("/runtime/validation-build-receipt.json", encoding="utf-8")
          )
          assert runtime_receipt["runtime_archive_sha256"] == archives["runtime"]["sha256"]
          assert validation_receipt["validation_archive_sha256"] == archives["validation"]["sha256"]
          assert validation_receipt["validation_archive_bytes"] == archives["validation"]["bytes"]
          assert (
              validation_receipt["validation_delta_archive_sha256"]
              == archives["validation_delta"]["sha256"]
          )
          assert (
              validation_receipt["validation_delta_archive_bytes"]
              == archives["validation_delta"]["bytes"]
          )
          assert (
              validation_receipt["validation_delta_reconstruction"]
              == "runtime.oci.tar+validation.delta.oci.tar"
          )
          assert lock["capture_contract"]["frames"] <= limits["max_evidence_frames"] <= 12
          assert archives["runtime"]["bytes"] <= limits["max_runtime_archive_bytes"]
          assert archives["validation"]["bytes"] <= limits["max_validation_archive_bytes"]
          assert (
              archives["validation_delta"]["bytes"]
              <= limits["max_validation_delta_archive_bytes"]
          )
          payloads = [
              archives["runtime"],
              record("/runtime/runtime-build-receipt.json", "runtime-build-receipt.json"),
              archives["validation_delta"],
              record("/runtime/validation-build-receipt.json", "validation-build-receipt.json"),
              record("/runtime/runtime-container-receipt.txt", "runtime-container-receipt.txt"),
              record(
                  "/runtime-verification/runtime-attestation-verification.json",
                  "runtime-attestation-verification.json",
              ),
              record(
                  "/runtime-verification/validation-attestation-verification.json",
                  "validation-attestation-verification.json",
              ),
              record(
                  "/runtime-verification/archive-bootstrap-receipt.json",
                  "archive-bootstrap-receipt.json",
              ),
              record(
                  "/runtime-verification/evidence-attestation-verification.json",
                  "evidence-attestation-verification.json",
              ),
              archives["evidence"],
              record(
                  "/output/evidence/trusted-cafe-manifest.json", "trusted-cafe-manifest.json"
              ),
              record(
                  "/output/cafe-attested-verification-receipt.json",
                  "cafe-attested-verification-receipt.json",
              ),
              record("/preflight/preverified-checkouts.v1.json", "preverified-checkouts.v1.json"),
              record(
                  "/preflight/cafe-authored-manifest.v1.json", "cafe-authored-manifest.v1.json"
              ),
              record("/selftest-a/receipt.json", "selftest-a/receipt.json"),
              record("/selftest-b/receipt.json", "selftest-b/receipt.json"),
          ]
          payload_bytes = sum(item["bytes"] for item in payloads)
          assert payload_bytes <= limits["max_protected_payload_bytes"]
          assert limits["max_protected_payload_bytes"] < limits["max_total_artifact_bytes"]
          assert limits["hosted_timeout_minutes"] <= 35
          assert limits["artifact_retention_days"] >= 90
          value = {
              "archives": archives,
              "limits": {
                  key: limits[key]
                  for key in (
                      "max_protected_payload_bytes",
                      "max_runtime_archive_bytes",
                      "max_total_artifact_bytes",
                      "max_validation_archive_bytes",
                      "max_validation_delta_archive_bytes",
                  )
              },
              "payload_bytes_excluding_receipt": payload_bytes,
              "payloads": sorted(payloads, key=lambda item: item["path"]),
              "schema": "living-town.cafe-protected-budget-receipt.v1",
              "stdin_loss_negative_control": "passed",
              "stdin_received": True,
          }
          data = (json.dumps(value, sort_keys=True, separators=(",", ":")) + "\n").encode("ascii")
          fd, temporary = tempfile.mkstemp(prefix=".protected-budget-", dir=os.path.dirname(output))
          with os.fdopen(fd, "wb") as stream:
              stream.write(data)
          os.replace(temporary, output)
          print(data.decode("ascii"), end="")
          PY
          test -s "$receipt"
          podman run --pull=never --rm --network none --read-only --cap-drop all \
            --security-opt no-new-privileges --pids-limit 32 --memory 128m --cpus 1 \
            --volume "$RUNNER_TEMP/cafe-budget-protected:/budget:ro" "$RUNTIME_REF" \
            python -B -c 'import json,pathlib,sys; p=pathlib.Path(sys.argv[1]); v=json.loads(p.read_text(encoding="ascii")); assert v["schema"]=="living-town.cafe-protected-budget-receipt.v1"; assert p.read_bytes()==(json.dumps(v,sort_keys=True,separators=(",",":"))+"\n").encode("ascii")' \
              /budget/protected-budget-receipt.json

      - name: Upload attested runtime archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trusted-cafe-runtime-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/cafe-runtime/runtime.oci.tar
            ${{ runner.temp }}/cafe-runtime/runtime-build-receipt.json
            ${{ runner.temp }}/cafe-runtime/validation.delta.oci.tar
            ${{ runner.temp }}/cafe-runtime/validation-build-receipt.json
            ${{ runner.temp }}/cafe-runtime/runtime-container-receipt.txt
            ${{ runner.temp }}/cafe-runtime-verification/runtime-attestation-verification.json
            ${{ runner.temp }}/cafe-runtime-verification/validation-attestation-verification.json
            ${{ runner.temp }}/cafe-runtime-verification/archive-bootstrap-receipt.json
            ${{ runner.temp }}/cafe-runtime-verification/evidence-attestation-verification.json
            ${{ runner.temp }}/cafe-budget-protected/protected-budget-receipt.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Upload attested cafe evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trusted-cafe-evidence-${{ inputs.candidate_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/cafe-output/evidence/trusted-cafe-evidence.tar.gz
            ${{ runner.temp }}/cafe-output/evidence/trusted-cafe-manifest.json
            ${{ runner.temp }}/cafe-output/cafe-attested-verification-receipt.json
            ${{ runner.temp }}/cafe-preflight/preverified-checkouts.v1.json
            ${{ runner.temp }}/cafe-preflight/cafe-authored-manifest.v1.json
            ${{ runner.temp }}/cafe-selftest-a/receipt.json
            ${{ runner.temp }}/cafe-selftest-b/receipt.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Publish hash-bound handoff summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '### Trusted cafe source-to-capture attestation v1'
            echo
            echo "- candidate SHA/tree: ${{ inputs.candidate_sha }} / ${{ steps.identity.outputs.candidate_tree }}"
            echo "- protected workflow SHA/tree: $GITHUB_SHA / ${{ steps.identity.outputs.workflow_tree }}"
            echo "- runtime OCI archive SHA-256: ${{ steps.capture.outputs.runtime_sha }}"
            echo "- evidence bundle SHA-256: ${{ steps.capture.outputs.bundle_sha }}"
            echo "- runtime attestation: ${{ steps.attest_runtime.outputs.attestation-url }}"
            echo "- evidence attestation: ${{ steps.attest_evidence.outputs.attestation-url }}"
            echo '- authority: evidence only; never Sim/navigation/collision/save/replay/portal/canon authority'
          } >> "$GITHUB_STEP_SUMMARY"
