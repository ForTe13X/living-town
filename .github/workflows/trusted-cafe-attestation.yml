name: Trusted cafe source attestation

on:
  pull_request:
    branches: [master]
    paths:
      - .github/workflows/trusted-cafe-attestation.yml
      - tools/trusted_cafe_capture.sh
      - tools/cafe_authored_manifest.py
      - tools/verify_cafe_attested_evidence.py
      - tools/cafe_attestation_selftest.py
      - evidence/cafe/runtime-lock.v1.json
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full same-repository candidate commit SHA to capture
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: trusted-cafe-${{ github.event_name }}-${{ inputs.candidate_sha || github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  pull_request_runtime_qualification:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: trusted
          persist-credentials: false

      - name: Enforce the six-path Stack A lease
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "$(git -C trusted rev-parse HEAD)" == "$HEAD_SHA" ]]
          [[ -z "$(git -C trusted status --porcelain=v1 --untracked-files=all)" ]]
          mapfile -t changed < <(git -C trusted diff --name-only "$BASE_SHA" "$HEAD_SHA")
          ((${#changed[@]} > 0))
          for path in "${changed[@]}"; do
            case "$path" in
              .github/workflows/trusted-cafe-attestation.yml|\
              tools/trusted_cafe_capture.sh|\
              tools/cafe_authored_manifest.py|\
              tools/verify_cafe_attested_evidence.py|\
              tools/cafe_attestation_selftest.py|\
              evidence/cafe/runtime-lock.v1.json) ;;
              *) echo "out-of-lease path: $path" >&2; exit 1 ;;
            esac
          done
          [[ "${#changed[@]}" -eq 6 ]]

      - name: Set up pinned host Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11.16"
          check-latest: false

      - name: Install hash-pinned GitHub CLI
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t pin < <(python -B - trusted/evidence/cafe/runtime-lock.v1.json <<'PY'
          import json, sys
          lock = json.load(open(sys.argv[1], encoding="utf-8"))
          for value in (lock["gh_cli"]["url"], lock["gh_cli"]["archive_filename"],
                        lock["gh_cli"]["archive_sha256"], lock["gh_cli"]["archive_top_level"],
                        lock["host_tools"]["gh"]):
              print(value)
          PY
          )
          [[ "${#pin[@]}" -eq 5 ]]
          mkdir "$RUNNER_TEMP/cafe-host-tools"
          curl --fail --location --silent --show-error --retry 5 --retry-all-errors \
            --output "$RUNNER_TEMP/cafe-host-tools/${pin[1]}" "${pin[0]}"
          printf '%s  %s\n' "${pin[2]}" "$RUNNER_TEMP/cafe-host-tools/${pin[1]}" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/cafe-host-tools/${pin[1]}" -C "$RUNNER_TEMP/cafe-host-tools"
          gh_dir="$RUNNER_TEMP/cafe-host-tools/${pin[3]}/bin"
          [[ "$("$gh_dir/gh" --version | awk 'NR==1 {print $3}')" == "${pin[4]}" ]]
          echo "$gh_dir" >> "$GITHUB_PATH"

      - name: Run deterministic trust-root self-test
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1 PYTHONHASHSEED=0
          python -B trusted/tools/cafe_attestation_selftest.py \
            --work-dir "$RUNNER_TEMP/cafe-selftest" \
            --receipt "$RUNNER_TEMP/cafe-selftest-receipt.json"

      - name: Build the immutable runtime twice
        shell: bash
        run: |
          set -euo pipefail
          bash trusted/tools/trusted_cafe_capture.sh build-runtime \
            trusted "$RUNNER_TEMP/cafe-runtime"

      - name: Load and smoke-test the exact OCI archive
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/cafe-runtime/runtime.oci.tar"
          expected="$(sha256sum "$archive" | awk '{print $1}')"
          [[ "$expected" == "$(python -B -c \
            'import json,sys; print(json.load(open(sys.argv[1]))["runtime_archive_sha256"])' \
            "$RUNNER_TEMP/cafe-runtime/runtime-build-receipt.json")" ]]
          podman image rm -f localhost/living-town/trusted-cafe-runtime:v1 >/dev/null 2>&1 || true
          podman load --input "$archive"
          {
            podman run --rm --network none localhost/living-town/trusted-cafe-runtime:v1 \
              python -B -c 'import PIL,platform; print(platform.python_version(), PIL.__version__)'
            podman run --rm --network none localhost/living-town/trusted-cafe-runtime:v1 \
              godot --version
          } | tee "$RUNNER_TEMP/runtime-smoke-receipt.txt"

      - name: Enforce hosted artifact budget
        shell: bash
        run: |
          set -euo pipefail
          python -B - trusted/evidence/cafe/runtime-lock.v1.json \
            "$RUNNER_TEMP/cafe-runtime/runtime.oci.tar" <<'PY'
          import json, os, sys
          lock = json.load(open(sys.argv[1], encoding="utf-8"))
          size = os.path.getsize(sys.argv[2])
          assert size <= lock["limits"]["max_runtime_archive_bytes"], (size, lock["limits"])
          assert lock["limits"]["hosted_timeout_minutes"] <= 35
          assert lock["limits"]["artifact_retention_days"] >= 90
          PY

      - name: Upload reproducible runtime qualification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cafe-runtime-qualification-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/cafe-runtime/runtime.oci.tar
            ${{ runner.temp }}/cafe-runtime/runtime-build-receipt.json
            ${{ runner.temp }}/cafe-selftest-receipt.json
            ${{ runner.temp }}/runtime-smoke-receipt.txt
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  protected_capture_and_attestation:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: Require protected default-branch workflow identity
        shell: bash
        env:
          EXPECTED_WORKFLOW_REF: ForTe13X/living-town/.github/workflows/trusted-cafe-attestation.yml@refs/heads/master
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == "ForTe13X/living-town" ]]
          [[ "$GITHUB_REF" == "refs/heads/master" ]]
          [[ "$GITHUB_WORKFLOW_REF" == "$EXPECTED_WORKFLOW_REF" ]]
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]

      - name: Checkout protected trust root
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          path: trusted
          persist-credentials: false

      - name: Checkout exact same-repository candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
          path: candidate
          persist-credentials: false

      - name: Verify checkout identities
        id: identity
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          [[ "$(git -C trusted rev-parse HEAD)" == "$GITHUB_SHA" ]]
          [[ "$(git -C candidate rev-parse HEAD)" == "$CANDIDATE_SHA" ]]
          [[ -z "$(git -C trusted status --porcelain=v1 --untracked-files=all)" ]]
          [[ -z "$(git -C candidate status --porcelain=v1 --untracked-files=all)" ]]
          echo "candidate_tree=$(git -C candidate show -s --format='%T' HEAD)" >> "$GITHUB_OUTPUT"
          echo "workflow_tree=$(git -C trusted show -s --format='%T' HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up pinned host Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11.16"
          check-latest: false

      - name: Install hash-pinned GitHub CLI
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t pin < <(python -B - trusted/evidence/cafe/runtime-lock.v1.json <<'PY'
          import json, sys
          lock = json.load(open(sys.argv[1], encoding="utf-8"))
          for value in (lock["gh_cli"]["url"], lock["gh_cli"]["archive_filename"],
                        lock["gh_cli"]["archive_sha256"], lock["gh_cli"]["archive_top_level"],
                        lock["host_tools"]["gh"]):
              print(value)
          PY
          )
          [[ "${#pin[@]}" -eq 5 ]]
          mkdir "$RUNNER_TEMP/cafe-host-tools"
          curl --fail --location --silent --show-error --retry 5 --retry-all-errors \
            --output "$RUNNER_TEMP/cafe-host-tools/${pin[1]}" "${pin[0]}"
          printf '%s  %s\n' "${pin[2]}" "$RUNNER_TEMP/cafe-host-tools/${pin[1]}" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/cafe-host-tools/${pin[1]}" -C "$RUNNER_TEMP/cafe-host-tools"
          gh_dir="$RUNNER_TEMP/cafe-host-tools/${pin[3]}/bin"
          [[ "$("$gh_dir/gh" --version | awk 'NR==1 {print $3}')" == "${pin[4]}" ]]
          echo "$gh_dir" >> "$GITHUB_PATH"

      - name: Run deterministic trust-root self-test
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1 PYTHONHASHSEED=0
          python -B trusted/tools/cafe_attestation_selftest.py \
            --work-dir "$RUNNER_TEMP/cafe-selftest" \
            --receipt "$RUNNER_TEMP/cafe-selftest-receipt.json"

      - name: Compile candidate source against the protected authored manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/cafe-preflight"
          cmp -s candidate/evidence/cafe/cafe-authored-ids.v1.json \
            trusted/evidence/cafe/cafe-authored-ids.v1.json
          cmp -s candidate/evidence/cafe/cafe-authored-manifest.v1.json \
            trusted/evidence/cafe/cafe-authored-manifest.v1.json
          python -B trusted/tools/cafe_authored_manifest.py \
            --repo candidate \
            --ids trusted/evidence/cafe/cafe-authored-ids.v1.json \
            --check trusted/evidence/cafe/cafe-authored-manifest.v1.json \
            --output "$RUNNER_TEMP/cafe-preflight/cafe-authored-manifest.v1.json"
          cmp -s "$RUNNER_TEMP/cafe-preflight/cafe-authored-manifest.v1.json" \
            trusted/evidence/cafe/cafe-authored-manifest.v1.json

      - name: Build the immutable runtime twice
        shell: bash
        run: |
          set -euo pipefail
          bash trusted/tools/trusted_cafe_capture.sh build-runtime \
            trusted "$RUNNER_TEMP/cafe-runtime"

      - name: Attest exact runtime OCI archive
        id: attest_runtime
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: ${{ runner.temp }}/cafe-runtime/runtime.oci.tar

      - name: Verify runtime attestation before loading
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$(gh --version | awk 'NR==1 {print $3}')" == \
            "$(python -B -c 'import json; print(json.load(open("trusted/evidence/cafe/runtime-lock.v1.json"))["host_tools"]["gh"])')" ]]
          gh attestation verify "$RUNNER_TEMP/cafe-runtime/runtime.oci.tar" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/trusted-cafe-attestation.yml" \
            --signer-digest "$GITHUB_SHA" \
            --source-digest "$GITHUB_SHA" \
            --source-ref refs/heads/master \
            --cert-oidc-issuer https://token.actions.githubusercontent.com \
            --deny-self-hosted-runners \
            --predicate-type https://slsa.dev/provenance/v1 \
            --format json > "$RUNNER_TEMP/cafe-runtime/runtime-attestation-verification.json"

      - name: Load attested archive and capture exact candidate
        id: capture
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          CANDIDATE_TREE: ${{ steps.identity.outputs.candidate_tree }}
          WORKFLOW_TREE: ${{ steps.identity.outputs.workflow_tree }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/cafe-runtime/runtime.oci.tar"
          runtime_sha="$(sha256sum "$archive" | awk '{print $1}')"
          [[ "$runtime_sha" == "$(python -B -c \
            'import json,sys; print(json.load(open(sys.argv[1]))["runtime_archive_sha256"])' \
            "$RUNNER_TEMP/cafe-runtime/runtime-build-receipt.json")" ]]
          podman image rm -f localhost/living-town/trusted-cafe-runtime:v1 >/dev/null 2>&1 || true
          podman load --input "$archive"
          mkdir "$RUNNER_TEMP/cafe-output"
          podman run --rm --network none --cap-drop all \
            --security-opt no-new-privileges --pids-limit 512 --memory 4g \
            --env CAFE_CHECKOUTS_PREVERIFIED=1 \
            --volume "$PWD/trusted:/trusted:ro" \
            --volume "$PWD/candidate:/candidate:ro" \
            --volume "$RUNNER_TEMP/cafe-runtime:/runtime:ro" \
            --volume "$RUNNER_TEMP/cafe-preflight:/preflight:ro" \
            --volume "$RUNNER_TEMP/cafe-output:/output:rw" \
            localhost/living-town/trusted-cafe-runtime:v1 \
            bash /trusted/tools/trusted_cafe_capture.sh capture \
              /candidate /output/evidence "$CANDIDATE_SHA" "$CANDIDATE_TREE" \
              "$GITHUB_SHA" "$WORKFLOW_TREE" "$GITHUB_REPOSITORY" \
              "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$runtime_sha" \
              /runtime/runtime-build-receipt.json \
              /preflight/cafe-authored-manifest.v1.json
          [[ -z "$(git -C trusted status --porcelain=v1 --untracked-files=all)" ]]
          [[ -z "$(git -C candidate status --porcelain=v1 --untracked-files=all)" ]]
          echo "runtime_sha=$runtime_sha" >> "$GITHUB_OUTPUT"
          echo "bundle_sha=$(sha256sum "$RUNNER_TEMP/cafe-output/evidence/trusted-cafe-evidence.tar.gz" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Attest exact evidence bundle
        id: attest_evidence
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: ${{ runner.temp }}/cafe-output/evidence/trusted-cafe-evidence.tar.gz

      - name: Independently verify bundle and GitHub provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          CANDIDATE_TREE: ${{ steps.identity.outputs.candidate_tree }}
          WORKFLOW_TREE: ${{ steps.identity.outputs.workflow_tree }}
          RUNTIME_SHA: ${{ steps.capture.outputs.runtime_sha }}
        run: |
          set -euo pipefail
          python -B trusted/tools/verify_cafe_attested_evidence.py \
            --bundle "$RUNNER_TEMP/cafe-output/evidence/trusted-cafe-evidence.tar.gz" \
            --candidate-root candidate --trusted-root trusted \
            --candidate-sha "$CANDIDATE_SHA" --candidate-tree "$CANDIDATE_TREE" \
            --workflow-sha "$GITHUB_SHA" --workflow-tree "$WORKFLOW_TREE" \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --runtime-archive-sha256 "$RUNTIME_SHA" \
            --receipt-output "$RUNNER_TEMP/cafe-output/cafe-attested-verification-receipt.json"

      - name: Enforce frame, retention, and total artifact budgets
        shell: bash
        run: |
          set -euo pipefail
          python -B - trusted/evidence/cafe/runtime-lock.v1.json \
            "$RUNNER_TEMP/cafe-runtime/runtime.oci.tar" \
            "$RUNNER_TEMP/cafe-output/evidence/trusted-cafe-evidence.tar.gz" <<'PY'
          import json, os, sys
          lock = json.load(open(sys.argv[1], encoding="utf-8"))
          runtime_size, evidence_size = map(os.path.getsize, sys.argv[2:])
          assert lock["capture_contract"]["frames"] <= lock["limits"]["max_evidence_frames"] <= 12
          assert runtime_size <= lock["limits"]["max_runtime_archive_bytes"]
          assert runtime_size + evidence_size <= lock["limits"]["max_total_artifact_bytes"]
          assert lock["limits"]["hosted_timeout_minutes"] <= 35
          assert lock["limits"]["artifact_retention_days"] >= 90
          PY

      - name: Upload attested runtime archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trusted-cafe-runtime-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/cafe-runtime/runtime.oci.tar
            ${{ runner.temp }}/cafe-runtime/runtime-build-receipt.json
            ${{ runner.temp }}/cafe-runtime/runtime-attestation-verification.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Upload attested cafe evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trusted-cafe-evidence-${{ inputs.candidate_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/cafe-output/evidence/trusted-cafe-evidence.tar.gz
            ${{ runner.temp }}/cafe-output/evidence/trusted-cafe-manifest.json
            ${{ runner.temp }}/cafe-output/cafe-attested-verification-receipt.json
            ${{ runner.temp }}/cafe-selftest-receipt.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Publish hash-bound handoff summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '### Trusted cafe source-to-capture attestation v1'
            echo
            echo "- candidate SHA/tree: ${{ inputs.candidate_sha }} / ${{ steps.identity.outputs.candidate_tree }}"
            echo "- protected workflow SHA/tree: $GITHUB_SHA / ${{ steps.identity.outputs.workflow_tree }}"
            echo "- runtime OCI archive SHA-256: ${{ steps.capture.outputs.runtime_sha }}"
            echo "- evidence bundle SHA-256: ${{ steps.capture.outputs.bundle_sha }}"
            echo "- runtime attestation: ${{ steps.attest_runtime.outputs.attestation-url }}"
            echo "- evidence attestation: ${{ steps.attest_evidence.outputs.attestation-url }}"
            echo '- authority: evidence only; never Sim/navigation/collision/save/replay/portal/canon authority'
          } >> "$GITHUB_STEP_SUMMARY"
