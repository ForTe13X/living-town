name: CI

on:
  push:
    # integration/batons 是产品累计分支；它此前没有 push 触发器，导致 live product tip
    # 可以长期保持 0 checks / 0 runs，而评审 PR 的 synthetic merge green 也无法替代它。
    branches: [master, integration/batons]
  pull_request:

# Cancel superseded runs on the same ref
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    # 短期把 15→35：本地全量 CI ~17-26 分钟，15 分钟每次都在 story_test 处被平台取消
    # （Codex 2026-08-06 §二实测两次 PR run 都 cancelled@15m，唯一红因是预算不是断言）。
    # 提高只放宽上限、不弱化任何门，反而让更多门跑到完成 ⇒ 解锁候选 PR 的 exact-head 收据。
    # 正式方案是拆成并行 required jobs（见 docs/113 §四·2），这只是过渡。
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      # push 事件的 GITHUB_SHA 是刚推到该 ref 的 tip；pull_request 则是 GitHub 的 merge ref。
      # checkout 默认取事件 ref/SHA。把两者逐位对账并打印单行回执，避免以后把旧 base 的
      # synthetic-merge green 误写成当前 integration/batons exact-tip green。
      - name: Verify checked-out event SHA
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [[ "$actual_sha" != "$GITHUB_SHA" ]]; then
            echo "checkout SHA mismatch: actual=$actual_sha event=$GITHUB_SHA" >&2
            exit 1
          fi
          printf 'CI_SOURCE event=%s ref=%s sha=%s\n' \
            "$GITHUB_EVENT_NAME" "$GITHUB_REF" "$actual_sha"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # tools/ci.sh 第 2b 步（art gate）当场重建十张出货角色表再逐字节比对，重建管线依赖 Pillow。
      # 不装它 ⇒ art_gate.py 直接退出、这道门在 GHA 上【每一个 PR 都红】而与改动无关 —— 正是
      # tools/visual_gate.sh 抬头②说的"没有任何 commit 却会自己变色的门"。
      # （G1 声明的越界：.github/ 不在本棒的所有权表里。回滚 = 删掉本步。）
      - name: Install Pillow (art gate 的重建管线依赖)
        run: python -m pip install --disable-pip-version-check "pillow>=10,<12"

      - name: Install Godot 4.6.2 (headless)
        run: |
          set -e
          GV=4.6.2-stable
          curl -fLo godot.zip "https://github.com/godotengine/godot/releases/download/${GV}/Godot_v${GV}_linux.x86_64.zip"
          unzip -q godot.zip
          sudo mv "Godot_v${GV}_linux.x86_64" /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          godot --version

      - name: Import project (headless)
        run: godot --headless --path game --import || true

      - name: CI gate (lints + S0 + test scenes)
        env:
          GODOT: godot
          PYTHON: python3
        run: bash tools/ci.sh
